# Room configuration for autonomous security drone
# This file defines all rooms with their positions, sizes, and properties
# Layout represents a realistic apartment with proper room connections

rooms:
  living_room:
    id: "1"
    name: "Living Room"
    center: [0.0, 0.0]
    size: [5.0, 4.0]
    color: [0.2, 0.8, 0.2, 0.3]  # RGBA - Green
    description: "Main living area"
    
  kitchen:
    id: "2"
    name: "Kitchen"
    center: [6.0, 0.0]
    size: [3.0, 3.0]
    color: [0.8, 0.2, 0.2, 0.3]  # RGBA - Red
    description: "Cooking and dining area"
    
  bedroom:
    id: "3"
    name: "Bedroom"
    center: [0.0, -5.0]
    size: [4.0, 3.0]
    color: [0.2, 0.2, 0.8, 0.3]  # RGBA - Blue
    description: "Main bedroom"
    
  bathroom:
    id: "4"
    name: "Bathroom"
    center: [4.0, -5.0]
    size: [2.0, 2.0]
    color: [0.8, 0.8, 0.2, 0.3]  # RGBA - Yellow
    description: "Main bathroom"
    
  hallway:
    id: "5"
    name: "Hallway"
    center: [3.0, -2.5]
    size: [1.0, 4.0]
    color: [0.8, 0.2, 0.8, 0.3]  # RGBA - Magenta
    description: "Connecting corridor"
    
  office:
    id: "6"
    name: "Office"
    center: [-5.0, 0.0]
    size: [3.0, 3.0]
    color: [0.2, 0.8, 0.8, 0.3]  # RGBA - Cyan
    description: "Home office/study"
    
  balcony:
    id: "7"
    name: "Balcony"
    center: [8.5, 0.0]
    size: [2.0, 2.5]
    color: [0.5, 0.8, 0.2, 0.3]  # RGBA - Light Green
    description: "Outdoor balcony area"
    
  storage:
    id: "8"
    name: "Storage"
    center: [-2.5, -5.0]
    size: [2.0, 2.0]
    color: [0.6, 0.4, 0.2, 0.3]  # RGBA - Brown
    description: "Storage room"

# Default investigation height for all rooms
default_investigation_height: 1.5

# Motion detection settings
motion_settings:
  cooldown_period: 30.0  # seconds before detecting motion again in same room
  alert_duration: 300.0  # seconds to keep motion alert active
