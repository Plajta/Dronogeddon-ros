# Room configuration for autonomous security drone
# This file defines all rooms with their positions, sizes, and properties
# Layout represents a realistic apartment with proper room connections and no overlaps

# Environment settings for simulation
environment:
  map_size: [400, 400]  # Map dimensions in pixels
  resolution: 0.05      # Meters per pixel
  origin: [-10.0, -10.0, 0.0]  # Map origin in world coordinates
  wall_thickness: 3     # Wall thickness in pixels
  door_size: 18         # Door opening size in pixels (18 * 0.05m = 0.9m = 90cm)
  drone_start_position: [0.0, 0.0, 0.0]  # Drone starts in center of Living Room

# Furniture definitions
furniture:
  living_room:
    - type: "sofa"
      position: [-0.8, -0.8]
      size: [1.8, 0.8]
    - type: "coffee_table"
      position: [0.5, 0.3]
      size: [0.8, 0.8]
  kitchen:
    - type: "counter"
      position: [3.5, 1.0]
      size: [2.0, 0.6]
    - type: "island"
      position: [3.5, -0.5]
      size: [1.0, 0.6]
  bedroom:
    - type: "bed"
      position: [-2.2, -3.8]
      size: [2.0, 1.4]
    - type: "dresser"
      position: [-3.8, -3.0]
      size: [1.2, 0.5]
  bathroom:
    - type: "toilet"
      position: [0.3, -4.2]
      size: [0.6, 0.8]
    - type: "sink"
      position: [1.5, -2.8]
      size: [0.8, 0.5]
  office:
    - type: "desk"
      position: [-2.2, 2.8]
      size: [1.2, 0.8]
    - type: "chair"
      position: [-0.8, 2.5]
      size: [0.6, 0.6]

# Door connections between rooms
# orientation: "horizontal" = door along X axis (for walls perpendicular to Y)
#              "vertical" = door along Y axis (for walls perpendicular to X)
doors:
  - from: "living_room"
    to: "hallway"
    position: [0.0, -1.5]
    orientation: "horizontal"  # Wall runs along X axis
  - from: "living_room"
    to: "kitchen"
    position: [2.0, 0.0]
    orientation: "vertical"  # Wall runs along Y axis
  - from: "living_room"
    to: "office"
    position: [0.0, 1.5]
    orientation: "horizontal"  # Wall runs along X axis
  - from: "hallway"
    to: "bedroom"
    position: [-1.5, -2.5]
    orientation: "horizontal"  # Wall runs along X axis
  - from: "hallway"
    to: "bathroom"
    position: [1.0, -2.5]
    orientation: "horizontal"  # Wall runs along X axis
  - from: "hallway"
    to: "storage"
    position: [2.0, -2.5]
    orientation: "horizontal"  # Wall runs along X axis
  - from: "kitchen"
    to: "balcony"
    position: [5.0, 0.0]
    orientation: "vertical"  # Wall runs along Y axis

rooms:
  living_room:
    id: "1"
    name: "Living Room"
    center: [0.0, 0.0]
    size: [4.0, 3.0]
    color: [0.2, 0.8, 0.2, 0.3]  # RGBA - Green
    description: "Main living area"
    
  kitchen:
    id: "2"
    name: "Kitchen"
    center: [3.5, 0.0]
    size: [3.0, 3.0]
    color: [0.8, 0.2, 0.2, 0.3]  # RGBA - Red
    description: "Cooking and dining area"
    
  bedroom:
    id: "3"
    name: "Bedroom"
    center: [-3.0, -3.75]
    size: [3.0, 2.5]
    color: [0.2, 0.2, 0.8, 0.3]  # RGBA - Blue
    description: "Main bedroom"
    
  bathroom:
    id: "4"
    name: "Bathroom"
    center: [1.0, -3.5]
    size: [2.0, 2.0]
    color: [0.8, 0.8, 0.2, 0.3]  # RGBA - Yellow
    description: "Main bathroom"
    
  hallway:
    id: "5"
    name: "Hallway"
    center: [0.0, -2.0]
    size: [6.0, 1.0]
    color: [0.8, 0.2, 0.8, 0.3]  # RGBA - Magenta
    description: "Connecting corridor"
    
  office:
    id: "6"
    name: "Office"
    center: [-1.25, 2.5]
    size: [2.5, 2.0]
    color: [0.2, 0.8, 0.8, 0.3]  # RGBA - Cyan
    description: "Home office/study"
    
  balcony:
    id: "7"
    name: "Balcony"
    center: [6.0, 0.0]
    size: [2.0, 3.0]
    color: [0.5, 0.8, 0.2, 0.3]  # RGBA - Light Green
    description: "Outdoor balcony area"
    
  storage:
    id: "8"
    name: "Storage"
    center: [3.0, -3.5]
    size: [2.0, 2.0]
    color: [0.6, 0.4, 0.2, 0.3]  # RGBA - Brown
    description: "Storage room"

# Default investigation height for all rooms
default_investigation_height: 1.5

# Motion detection settings
motion_settings:
  cooldown_period: 30.0  # seconds before detecting motion again in same room
  alert_duration: 300.0  # seconds to keep motion alert active
